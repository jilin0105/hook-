plugins {
    id 'com.android.application' version '8.1.0' // Specify AGP version here
    id 'org.jetbrains.kotlin.android' version '1.9.0' // Specify Kotlin plugin version here
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.reversing.nativecryptohook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // compileOnly 'de.robv.android.xposed:api:82'
    // 如果不用 Kotlin 可以把 .kt 改成 .java
}
