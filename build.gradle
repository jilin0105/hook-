buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0" // Assuming Kotlin, based on .kt files
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.8.0'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.reversing.nativecryptohook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    // 如果不用 Kotlin 可以把 .kt 改成 .java
}
